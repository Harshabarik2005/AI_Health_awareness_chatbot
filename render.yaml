services:
  - type: web
    name: healthaware-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python scripts/ingest.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: CHROMA_PERSIST_DIR
        value: ./data/chroma_db
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_TIMEOUT_SECONDS
        value: "60"
      - key: GROQ_API_KEY
        sync: false
